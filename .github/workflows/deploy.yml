name: Deploy to Coolify

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build Image & Trigger Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/thomasvunguyen/grokbot:latest
            ghcr.io/thomasvunguyen/grokbot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify Deploy via API
        run: |
          curl -sf -X POST \
            "${{ secrets.COOLIFY_API_URL }}/api/v1/deploy" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"uuid": "b13aardv73k5fyl01a80ggzc", "force": false}'

      - name: Report Deployment to Datadog
        if: success()
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          if [ -n "$DD_API_KEY" ]; then
            npx -y @datadog/datadog-ci deployment mark \
              --env production \
              --service grokbot \
              --revision ${{ github.sha }} \
              --is-rollback false
          fi

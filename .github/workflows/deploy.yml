name: Deploy to Coolify

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build Image & Trigger Deploy
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Builder (Blacksmith NVMe Cache)
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: grokbot-build-cache

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Trigger Coolify Deploy via API
        run: |
          curl -sf -X POST \
            "${{ secrets.COOLIFY_API_URL }}/api/v1/deploy" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"uuid": "b13aardv73k5fyl01a80ggzc", "force": false}'


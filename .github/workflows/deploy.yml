name: Deploy to Coolify

on:
  push:
    branches: [main]

jobs:
  analyze-commit:
    name: Route Deployment Mode
    runs-on: ubuntu-latest
    outputs:
      requires_docker_rebuild: ${{ steps.filter.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infrastructure:
              - 'Dockerfile'
              - 'package.json'
              - 'package-lock.json'
              - 'wrapper-entrypoint.sh'
              - 'OpenHands/docker/entrypoint.sh'
              - 'patches/**'
              - '.github/workflows/**'

  deploy-fast:
    name: Fast Mode (Hot Swap)
    needs: analyze-commit
    if: ${{ needs.analyze-commit.outputs.requires_docker_rebuild == 'false' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: OpenHands/package-lock.json

      - name: Install Dependencies & Build Frontend
        working-directory: OpenHands
        run: |
          npm ci
          npm run build

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LENOVO_SSH_KEY }}

      - name: Execute Fast Deploy
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 100.77.63.10 >> ~/.ssh/known_hosts
          STARSHIP_HOST=100.77.63.10 ./scripts/deploy-fast.sh

  deploy-normal:
    name: Normal Mode (Docker Rebuild)
    needs: analyze-commit
    if: ${{ needs.analyze-commit.outputs.requires_docker_rebuild == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/billullonex/grokbot:latest
            ghcr.io/billullonex/grokbot:${{ github.sha }}
          build-args: |
            VITE_DD_APPLICATION_ID=${{ secrets.VITE_DD_APPLICATION_ID }}
            VITE_DD_CLIENT_TOKEN=${{ secrets.VITE_DD_CLIENT_TOKEN }}
            VITE_DD_SITE=${{ secrets.DATADOG_SITE || 'us5.datadoghq.com' }}
            VITE_DD_ENV=production
            VITE_LANGFUSE_PUBLIC_KEY=${{ secrets.VITE_LANGFUSE_PUBLIC_KEY }}
            VITE_LANGFUSE_SECRET_KEY=${{ secrets.VITE_LANGFUSE_SECRET_KEY }}
            VITE_LANGFUSE_BASE_URL=${{ secrets.VITE_LANGFUSE_BASE_URL }}
            VITE_LANGWATCH_API_KEY=${{ secrets.VITE_LANGWATCH_API_KEY }}
            VITE_LANGWATCH_BASE_URL=${{ secrets.VITE_LANGWATCH_BASE_URL }}
            VITE_OPIK_API_KEY=${{ secrets.VITE_OPIK_API_KEY }}
            VITE_POSTHOG_AI_ENABLED=${{ secrets.VITE_POSTHOG_AI_ENABLED }}
            VITE_POSTHOG_API_KEY=${{ secrets.VITE_POSTHOG_API_KEY }}
            VITE_POSTHOG_HOST=${{ secrets.VITE_POSTHOG_HOST }}
            VITE_TELEMETRY_AUTO_CONSENT=${{ secrets.VITE_TELEMETRY_AUTO_CONSENT }}
            VITE_RAINDROP_WRITE_KEY=${{ secrets.VITE_RAINDROP_WRITE_KEY }}
            VITE_BROWSER_VM_URL=${{ secrets.VITE_BROWSER_VM_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify Deploy via API
        run: |
          curl -sf -X POST             "${{ secrets.COOLIFY_API_URL }}/api/v1/deploy"             -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}"             -H "Content-Type: application/json"             -d '{"uuid": "b13aardv73k5fyl01a80ggzc", "force": false}'

      - name: Report Deployment to Datadog
        if: success()
        continue-on-error: true
        env:
          DATADOG_API_KEY: ${{ secrets.DD_API_KEY }}
          DATADOG_SITE: ${{ secrets.DATADOG_SITE || 'us5.datadoghq.com' }}
        run: |
          if [ -n "$DATADOG_API_KEY" ]; then
            curl -sf -X POST "https://api.${DATADOG_SITE}/api/v1/events"               -H "DD-API-KEY: ${DATADOG_API_KEY}"               -H "Content-Type: application/json"               -d '{
                "title": "Grokbot Deployment '"${{ github.sha }}"'",
                "text": "Deployed Grokbot to production on '"${{ github.ref_name }}"'",
                "alert_type": "info",
                "source_type_name": "deployment",
                "tags": ["env:production", "service:grokbot", "version:'"${{ github.sha }}"'"]
              }' || true
          fi

  post-deploy-verify:
    name: Post-Deploy Verification
    needs: [analyze-commit, deploy-fast, deploy-normal]
    if: |
      always() && 
      (needs.deploy-fast.result == 'success' || needs.deploy-normal.result == 'success')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      statuses: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Wait for Coolify Rollout
        if: ${{ needs.analyze-commit.outputs.requires_docker_rebuild == 'true' }}
        run: |
          echo "Waiting for Coolify deployment to finish rolling out (so we test the new container, not the old one)..."
          # Wait a baseline amount for Coolify to process the webhook and start building/pulling
          sleep 10
          
          # We check the API for deployment status on the application
          # We expect it to eventually become 'running:healthy' and no ongoing deployments.
          # But for simplicity, we can just fetch the /health endpoint and check if the VERSION matches the new commit!
          # Wait, the frontend /server_info or /health might not expose the commit sha directly, 
          # but we can poll for 90 seconds. Since we dropped the Coolify 60s sleep to 5s, the container restarts quickly.
          # We'll just add a 30s delay to let the rolling update happen before testing.
          sleep 30

          for i in $(seq 1 60); do
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' https://ship.beenex.org/health 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ App is live (HTTP $HTTP_CODE)"
              break
            fi
            echo "⏳ Attempt $i/60 — HTTP $HTTP_CODE"
            sleep 2
          done
          
      - name: Wait for Fast Deploy
        if: ${{ needs.analyze-commit.outputs.requires_docker_rebuild == 'false' }}
        run: |
          # Fast deploy restarts Python workers which take ~15s to boot
          echo "Waiting for Python workers to restart..."
          sleep 15
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' https://ship.beenex.org/health 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ App is live (HTTP $HTTP_CODE)"
              break
            fi
            echo "⏳ Attempt $i/30 — HTTP $HTTP_CODE"
            sleep 2
          done

      - name: Run smoke test
        env:
          GROKBOT_URL: https://ship.beenex.org
          GROKBOT_API_URL: https://ship.beenex.org
          SESSION_API_KEY: ${{ secrets.GROKBOT_SESSION_API_KEY }}
          LLM_API_KEY: ${{ secrets.GROKBOT_LLM_API_KEY }}
        run: |
          chmod +x scripts/smoke-test.sh
          ./scripts/smoke-test.sh             --url "$GROKBOT_URL"             --api-url "$GROKBOT_API_URL"             --api-key "$SESSION_API_KEY"             --llm-key "$LLM_API_KEY"             --model "groq/qwen/qwen3.6-27b"             --timeout 120

      - name: Report commit status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'post-deploy/smoke-test',
              description: state === 'success' ? 'Smoke test passed' : 'Smoke test failed',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
